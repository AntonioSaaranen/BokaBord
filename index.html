<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boka Bord — Stockholm</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <div class="header-scene" aria-hidden="true">
      <div class="scene-blob scene-blob--1"></div>
      <div class="scene-blob scene-blob--2"></div>
      <div class="scene-blob scene-blob--3"></div>
      <div class="scene-blob scene-blob--4"></div>
    </div>
    <div class="header-inner">
      <p class="header-eyebrow">Stockholm &nbsp;·&nbsp; Fine Dining</p>
      <h1>Boka Bord</h1>
      <div class="header-rule">
        <span class="header-rule-line"></span>
        <span class="header-rule-diamond"></span>
        <span class="header-rule-line"></span>
      </div>
      <p class="tagline">Tillgänglighet i realtid — två månader framöver</p>
    </div>
  </header>

  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>

    <div class="panel" id="panel">
      <div class="panel-header">
        <div class="panel-meta">
          <div class="panel-cuisine"></div>
          <h2 class="panel-name"></h2>
          <div class="panel-desc"></div>
          <p class="panel-note" hidden></p>
        </div>
        <div class="panel-actions">
          <a class="book-btn panel-book-btn" href="#" target="_blank" rel="noopener noreferrer">Boka bord</a>
          <span class="source-badge" id="panel-badge" data-source="loading">Hämtar…</span>
        </div>
      </div>

      <div class="panel-guest-row">
        <span class="guest-row-label">Antal gäster</span>
        <div class="panel-guest-btns" id="guest-btns"></div>
      </div>

      <div class="panel-calendar-area">
        <div class="calendar-tabs" id="cal-tabs"></div>
        <div class="calendar-wrapper" id="cal-wrapper"></div>
        <div class="legend">
          <div class="legend-item">
            <div class="legend-swatch legend-swatch--available"></div>
            Lediga bord
          </div>
          <div class="legend-item">
            <div class="legend-swatch legend-swatch--scarce"></div>
            Sista platser
          </div>
          <div class="legend-item">
            <div class="legend-swatch legend-swatch--full"></div>
            Fullbokat
          </div>
          <div class="legend-item">
            <div class="legend-swatch legend-swatch--closed"></div>
            Stängt
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <p>Tillgänglighetsdata är indikativ. Slutgiltig bokning sker hos respektive restaurang.</p>
  </footer>

  <div id="modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-box">
      <button class="modal-close" id="modal-close">&times;</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
